<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>VinylMatrix · local preview</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#171b1c;color:#e7e9e4;font-family:system-ui,sans-serif}header{max-width:1450px;margin:0 auto 28px}h1{font-weight:450;letter-spacing:-.04em;margin:0 0 8px}p{color:#a4aea9;line-height:1.6;font-size:14px}select,button{font:inherit;padding:8px 12px;border:1px solid #66716c;border-radius:6px;color:inherit;background:#222929;margin:4px}label{font-size:13px}#grid{max-width:704px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,340px));gap:24px;align-items:start}.sample>h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:#b6bfba;margin:0 0 12px}vinylmatrix-card{width:100%}#events{max-width:1450px;margin:28px auto;font-size:12px;white-space:pre-wrap;color:#a4aea9}.note{font-size:12px}.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}@media(max-width:500px){body{padding:18px}#grid{grid-template-columns:minmax(0,340px);justify-content:center}}
</style></head><body>
<header><h1>VinylMatrix Card</h1><p>Local interactive preview · simulated players, no Home Assistant connection.</p><div class="tools">
<label>Playback <select id="state"><option>playing</option><option>paused</option><option>idle</option><option>buffering</option><option>off</option><option>unavailable</option></select></label>
<label>Color <select id="color"><option>dark</option><option>light</option></select></label>
<button id="switch">Play on second player</button><button id="cover">Toggle cover</button><button id="stream">Toggle live stream</button><button id="fail">Fail next command</button>
</div><p class="note">Theme controls below are the real card. Header controls only simulate player updates.</p></header>
<main id="grid"></main><pre id="events" aria-live="polite">No commands sent.</pre>
<script type="module">
// Vite excludes dist from its file watcher; a unique URL avoids serving a cached older build.
await import(/* @vite-ignore */ './dist/vinylmatrix-card.js?preview='+Date.now());
const themes=['minimal','classic'];
const entities=['media_player.living_room','media_player.office'];
const attrs={friendly_name:'Living room',supported_features:16447,media_title:'Night Session',media_artist:'Studio Ensemble',media_content_id:'track-1',media_duration:342,media_position:138,media_position_updated_at:new Date().toISOString(),volume_level:.48,entity_picture:'/dev/cover.svg'};
let states={[entities[0]]:{entity_id:entities[0],state:'playing',attributes:{...attrs}},[entities[1]]:{entity_id:entities[1],state:'idle',attributes:{...attrs,friendly_name:'Office',media_title:'Morning Light',media_content_id:'track-2'}}};
let fail=false, calls=[];
const grid=document.querySelector('#grid');
const cards=themes.map(theme=>{const sample=document.createElement('section');sample.className='sample';sample.innerHTML=`<h2>${theme === 'minimal' ? 'Minimal · default' : theme}</h2>`;const card=document.createElement('vinylmatrix-card');card.setConfig({type:'custom:vinylmatrix-card',entities,theme});sample.append(card);grid.append(sample);return card;});
function update(){const hass={states:{...states},locale:{language:'en'},themes:{darkMode:document.querySelector('#color').value==='dark'},callService:async(domain,service,data)=>{calls.push({domain,service,data});document.querySelector('#events').textContent=JSON.stringify(calls.slice(-4),null,2);if(fail){fail=false;throw Error('Simulated failure')}const p=structuredClone(states[data.entity_id]);if(service==='media_play')p.state='playing';if(service==='media_pause')p.state='paused';if(service==='media_stop')p.state='idle';if(service==='volume_set')p.attributes.volume_level=data.volume_level;if(service==='volume_mute')p.attributes.is_volume_muted=data.is_volume_muted;if(service==='media_seek'){p.attributes.media_position=data.seek_position;p.attributes.media_position_updated_at=new Date().toISOString()}if(service.includes('track')){p.attributes.media_title=p.attributes.media_title==='Night Session'?'Morning Light':'Night Session';p.attributes.media_content_id=String(Date.now());p.attributes.media_position=0;p.attributes.media_position_updated_at=new Date().toISOString()}states={...states,[data.entity_id]:p};update();}};cards.forEach(c=>c.hass=hass);}
document.querySelector('#state').onchange=e=>{states[entities[0]]={...states[entities[0]],state:e.target.value};states[entities[1]]={...states[entities[1]],state:'idle'};update()};
document.querySelector('#color').onchange=update;
document.querySelector('#switch').onclick=()=>{states[entities[0]]={...states[entities[0]],state:'paused'};states[entities[1]]={...states[entities[1]],state:'playing'};update()};
document.querySelector('#cover').onclick=()=>{for(const p of Object.values(states))p.attributes.entity_picture=p.attributes.entity_picture?'':'/dev/cover.svg';update()};
document.querySelector('#stream').onclick=()=>{for(const p of Object.values(states))p.attributes.media_duration=p.attributes.media_duration?undefined:342;update()};
document.querySelector('#fail').onclick=()=>{fail=true};
// Deliberate development-only hook for browser integration tests.
const focusedTheme=new URLSearchParams(location.search).get('theme');
if(themes.includes(focusedTheme)){document.querySelector('header').hidden=true;document.querySelector('#events').hidden=true;grid.style.display='block';grid.style.maxWidth=focusedTheme==='classic'?'900px':'480px';cards.forEach((c,i)=>{c.parentElement.hidden=themes[i]!==focusedTheme;c.parentElement.querySelector('h2').hidden=true;});document.body.style.padding='0';}
window.preview={cards,entities,get states(){return states},get calls(){return calls},setStates(value){states=value;update()},update};update();
</script></body></html>
